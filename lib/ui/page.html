<script nonce="__NONCE__">
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

  const STATE_TEXT = {
    shared: 'shared with ~/.claude',
    private: 'private to this profile',
    empty: 'private, empty',
    missing: 'missing',
    'foreign-link': 'links outside ~/.claude',
    pool: 'this account is the shared pool',
  };
  const STATE_ICON = { shared: 'link', private: 'lock', empty: 'lock', missing: 'minus', 'foreign-link': 'alert', pool: 'folder' };
  const GROUP_TEXT = { projects: 'Projects', tools: 'Tools', config: 'Config' };
  const GROUP_HELP = {
    projects: 'Session history (projects/)',
    tools: 'skills/, agents/, commands/',
    config: 'mcp.json, settings.json, CLAUDE.md — can run hooks and MCP servers',
  };
  const KIND_ICON = { change: 'arrow', same: 'minus', warn: 'alert', error: 'xcircle', info: 'info' };

  let data = null;
  let doctor = null;
  let activity = [];
  let mcp = null;
  let backups = [];
  let lastSync = 0;
  let view = 'profiles';
  let changedBadges = new Set();

  // --- API ---------------------------------------------------------------
  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json', 'X-CCHost': '1' } : { 'X-CCHost': '1' },
      body: body ? JSON.stringify(body) : undefined,
    });
    // Session expired or signed out elsewhere: reload shows the sign-in page.
    if (res.status === 401) { location.replace('/'); throw new Error('Signed out'); }
    let json = null;
    try { json = await res.json(); } catch { /* non-JSON error */ }
    if (!res.ok) throw new Error((json && json.error) || `Request failed (${res.status})`);
    return json;
  }

  const UPDATE_CMD = 'npm install -g cchost@latest';
  function renderUpdate() {
    const u = data && data.update;
    const row = $('#update');
    row.hidden = !u;
    if (!u) return;
    $('#update-text').textContent = `Update to ${u.latest}`;
    row.dataset.tip = `cchost ${u.latest} is available`;
    row.setAttribute('aria-label', `cchost ${u.latest} is available, you have ${u.current}. Copy the update command`);
  }
  async function loadState() {
    try {
      const next = await api('/api/state');
      lastSync = Date.now();
      renderSync();
      // Re-render only when the disk actually changed, so polling never
      // steals focus, hover or scroll from what the user is doing.
      const changed = JSON.stringify(next) !== JSON.stringify(data);
      data = next;
      if (!changed) return;
      $('#count-profiles').textContent = data.profiles.length || '';
      renderUpdate();
      if (view === 'profiles' || view === 'pool') render();
      refreshOpenPanel();
    } catch (err) {
      $('#sync-text').textContent = 'Cannot reach cchost ui — is it still running?';
    }
  }
  async function loadDoctor() {
    doctor = null;
    if (view === 'doctor') render();
    try {
      doctor = (await api('/api/doctor')).checks;
    } catch (err) {
      doctor = { error: err.message };
    }
    updateDoctorCount();
    if (view === 'doctor') render();
  }
  async function loadMcp() {
    try {
      const next = await api('/api/mcp');
      const changed = JSON.stringify(next) !== JSON.stringify(mcp);
      mcp = next;
      const n = mcp.drift.length;
      const el = $('#count-mcp');
      el.textContent = n || '';
      el.className = 'count fold' + (n ? ' warn' : '');
      if (changed && view === 'mcp') render();
    } catch (err) {
      mcp = { error: err.message, targets: [], drift: [] };
      if (view === 'mcp') render();
    }
  }
  async function loadBackups() {
    try {
      backups = (await api('/api/backups')).backups;
    } catch { backups = []; }
    if (view === 'activity') render();
  }
  async function loadActivity() {
    activity = (await api('/api/activity')).activity;
    $('#count-activity').textContent = activity.length || '';
    if (view === 'activity') render();
  }
  function updateDoctorCount() {
    const el = $('#count-doctor');
    if (!Array.isArray(doctor)) { el.textContent = ''; return; }
    const errs = doctor.filter((c) => c.status === 'error').length;
    const warns = doctor.filter((c) => c.status === 'warn').length;
    el.textContent = errs || warns || '';
    el.className = 'count' + (errs ? ' err' : warns ? ' warn' : '');
  }
  function renderSync() {
    if (!lastSync) return;
    const s = Math.round((Date.now() - lastSync) / 1000);
    $('#sync-text').textContent = s < 5 ? 'Read from disk just now' : `Read from disk ${s}s ago`;
  }

  // --- Rendering helpers --------------------------------------------------
  function badge(profile, r) {
    const st = profile.resources[r.id];
    const key = `${profile.name}:${r.id}`;
    return `<span class="badge ${st}${changedBadges.has(key) ? ' changed' : ''}" title="${esc(r.label)}: ${esc(STATE_TEXT[st])}">${icon(STATE_ICON[st])}${esc(r.label)}<span class="sr">, ${esc(STATE_TEXT[st])}</span></span>`;
  }
  function groupsOf(profile) {
    return Object.keys(data.groups).map((g) => {
      const rs = data.resources.filter((r) => r.group === g);
      return `<div class="group"><span>${GROUP_TEXT[g]}</span><div class="badges">${rs.map((r) => badge(profile, r)).join('')}</div></div>`;
    }).join('');
  }
  function metaOf(p) {
    if (p.kind === 'endpoint') return `Custom endpoint · ${esc(p.endpoint)}`;
    return p.email ? `${esc(p.email)} · Subscription` : 'Subscription';
  }
  function loginPill(p) {
    if (p.kind === 'endpoint') return `<span class="pill ep">Endpoint</span>`;
    return p.loggedIn ? `<span class="pill on">Logged in</span>` : `<span class="pill">Not logged in</span>`;
  }
  function linesHtml(lines, result, reveal = result) {
    if (!lines.length) return '<p class="muted">Nothing to do.</p>';
    return `<ul class="lines${result ? ' result' : ''}${reveal ? ' reveal' : ''}">${lines.map((l, i) => {
      const k = result && l.kind === 'change' ? 'check' : KIND_ICON[l.kind] || 'info';
      return `<li class="${esc(l.kind)}" style="--i:${i}"><span class="k">${icon(k)}</span><span class="res">${esc(l.label || '')}</span><span>${esc(l.text)}</span></li>`;
    }).join('')}</ul>`;
  }
  function relTime(iso) {
    const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // --- Views --------------------------------------------------------------
  let renderedView = null;
  function render() {
    const el = $('#view');
    // Entrance motion only when switching views, never on background refresh.
    if (renderedView !== view) {
      el.classList.remove('enter');
      void el.offsetWidth;
      el.classList.add('enter');
      clearTimeout(render.t);
      render.t = setTimeout(() => el.classList.remove('enter'), 700);
      renderedView = view;
    }
    const titles = { profiles: 'Profiles', pool: 'Shared pool', mcp: 'MCP servers', doctor: 'Doctor', activity: 'Activity' };
    $('#title').textContent = titles[view];
    $('#top-add').hidden = view !== 'profiles';
    document.title = `${titles[view]} · cchost`;
    document.querySelectorAll('.nav a').forEach((a) => {
      if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (view === 'profiles') el.innerHTML = viewProfiles();
    if (view === 'pool') el.innerHTML = viewPool();
    if (view === 'mcp') el.innerHTML = viewMcp();
    if (view === 'doctor') el.innerHTML = viewDoctor();
    if (view === 'activity') el.innerHTML = viewActivity();
  }

  const LEGEND = [
    ['shared', 'Shared', 'linked to ~/.claude, same content in every sharing profile'],
    ['private', 'Private', 'this profile\'s own copy, not seen by others'],
    ['missing', 'Missing', 'not on disk yet; Doctor can create it'],
    ['foreign-link', 'Foreign link', 'points outside ~/.claude; cchost leaves it alone'],
  ];
  function legendItems() {
    const foreign = data.profiles.some((p) => Object.values(p.resources).includes('foreign-link'));
    return LEGEND.filter(([st]) => st !== 'foreign-link' || foreign).map(([st, term, desc]) =>
      `<div><dt><span class="badge key ${st}" aria-hidden="true">${icon(STATE_ICON[st])}</span>${term}</dt><dd>${desc}</dd></div>`).join('');
  }
  function viewProfiles() {
    if (!data) return '<p class="muted">Reading profiles…</p>';
    const ex = data.existing || {};
    const callout = ex.found && ex.loggedIn && !ex.name ? `<div class="callout"><p>You already use Claude Code${ex.email ? ` as <b>${esc(ex.email)}</b>` : ''} with plain <code>claude</code>. Give that account a name to see it here and start it with <code>cchost use</code>. Nothing is moved or copied.</p>
      <button class="btn" type="button" data-act="name-existing">${icon('plus')}Name this account</button></div>` : '';
    const head = callout + `<div class="toolbar">
      <p>${data.profiles.length} profile${data.profiles.length === 1 ? '' : 's'} in <code>${esc(data.profilesDir)}</code></p>
      <dl class="legend" aria-label="What the badge colours mean">${legendItems()}</dl>
    </div>`;
    if (!data.profiles.length) {
      return head + `<div class="empty"><h2>No profiles yet</h2>
        <p>A profile is a separate Claude Code login with its own settings. Each one can share skills, settings and history with <code>~/.claude</code>, or keep them private.</p>
        <button class="btn primary" type="button" data-act="add">${icon('plus')}Add your first profile</button></div>`;
    }
    return head + `<div class="cards">${data.profiles.map((p, i) => p.alias ? `
      <article class="card" style="--i:${i}" aria-label="${esc(p.name)}, your existing account">
        <div class="card-head"><div><h2>${esc(p.name)} <span class="pill me">Existing account</span></h2><p class="meta">${metaOf(p)} · plain <code>claude</code></p></div>${loginPill(p)}</div>
        <p class="muted">Lives in <code>~/.claude</code>, which is the shared pool itself, so every resource is the pool's. Start it with <code>claude</code> or <code>cchost use ${esc(p.name)}</code>.</p>
        <div class="card-actions">
          <a class="btn" href="#mcp">${icon('plug')}MCP servers</a>
          <button class="btn quiet" type="button" data-act="remove" data-profile="${esc(p.name)}">${icon('x')}Forget name</button>
        </div>
      </article>` : `
      <article class="card" style="--i:${i}" aria-label="${esc(p.name)}">
        <div class="card-head"><div><h2>${esc(p.name)}</h2><p class="meta">${metaOf(p)}</p></div>${loginPill(p)}</div>
        <div class="groups">${groupsOf(p)}</div>
        <div class="card-actions">
          <button class="btn" type="button" data-act="manage" data-profile="${esc(p.name)}">${icon('sliders')}Manage sharing</button>
          <button class="btn quiet" type="button" data-act="remove" data-profile="${esc(p.name)}">${icon('trash')}Remove</button>
        </div>
      </article>`).join('')}</div>`;
  }

  function viewPool() {
    if (!data) return '<p class="muted">Reading profiles…</p>';
    const rows = data.resources.map((r) => {
      const by = (st) => data.profiles.filter((p) => !p.alias && (p.resources[r.id] === st || (st === 'private' && p.resources[r.id] === 'empty')));
      const chips = (list) => list.length ? `<div class="chips">${list.map((p) => `<span class="chip">${esc(p.name)}</span>`).join('')}</div>` : '<span class="muted">—</span>';
      return `<tr><td data-label="Resource"><code>~/.claude/${esc(r.label)}</code></td><td data-label="Group">${GROUP_TEXT[r.group]}</td><td data-label="Shared by">${chips(by('shared'))}</td><td data-label="Private in">${chips(by('private'))}</td></tr>`;
    }).join('');
    return `<div class="toolbar"><p>Everything in <code>~/.claude</code> is visible to every profile that shares it. Changes made in one sharing profile show up in all of them.</p></div>
      <table class="table stack"><thead><tr><th>Resource</th><th>Group</th><th>Shared by</th><th>Private in</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function targetLabel(t) {
    if (t.kind === 'pool') return 'Pool';
    return t.target;
  }
  function serverIn(t, name) { return t.servers.find((s) => s.scope !== 'local' && s.name === name); }
  function referenceFp(name) {
    const pool = mcp.targets.find((t) => t.kind === 'pool');
    const inPool = pool && serverIn(pool, name);
    if (inPool) return inPool.fp;
    const counts = {};
    for (const t of mcp.targets) { const s = serverIn(t, name); if (s) counts[s.fp] = (counts[s.fp] || 0) + 1; }
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  }
  function serverSummary(s) {
    const what = s.url || [s.command, ...(s.args || [])].filter(Boolean).join(' ');
    const secrets = s.envKeys.length + s.headerKeys.length;
    return `${what}${secrets ? ` · ${secrets} secret${secrets === 1 ? '' : 's'} hidden` : ''}`;
  }
  function markFor(t, name) {
    const s = serverIn(t, name);
    if (!s) return { cls: 'none', text: '—', title: `Not in ${targetLabel(t)}` };
    if (s.fp !== referenceFp(name)) return { cls: 'differs', icon: 'alert', text: 'Differs', title: `${targetLabel(t)} has its own, different "${name}"` };
    if (t.kind === 'pool') return { cls: 'pool', icon: 'folder', text: 'Shared', title: 'In the pool: profiles that share mcp.json get it' };
    if (s.fromPool) return { cls: 'pool', icon: 'link', text: 'From pool', title: `${targetLabel(t)} got it from the pool` };
    return { cls: 'has', icon: 'check', text: 'Has it', title: `${targetLabel(t)} has it` };
  }
  function viewMcp() {
    if (!mcp) return '<p class="muted">Reading MCP servers…</p>';
    if (mcp.error) return `<div class="banner">${icon('xcircle')}${esc(mcp.error)}</div>`;
    const ts = mcp.targets;
    const names = [...new Set(ts.flatMap((t) => t.servers.filter((s) => s.scope !== 'local').map((s) => s.name)))].sort();
    const drift = mcp.drift.length ? `<div class="callout"><p><b>${mcp.drift.length} profile${mcp.drift.length === 1 ? ' is' : 's are'} missing pool servers:</b> ${mcp.drift.map((d) => `${esc(d.profile)} (${d.servers.map(esc).join(', ')})`).join('; ')}.</p>
      <button class="btn primary" type="button" data-act="mcp-sync">${icon('refresh')}Sync pool…</button></div>` : '';
    const intro = `<div class="toolbar"><p>Claude Code reads MCP servers from each account. Servers in the <b>pool</b> go to every profile that shares <code>mcp.json</code>. Secrets in env and headers are never shown here.</p></div>`;
    if (!names.length && !ts.some((t) => t.servers.length)) {
      return drift + intro + `<div class="empty"><h2>No MCP servers yet</h2><p>Add one in any profile with <code>claude mcp add</code>, then copy it to other profiles or into the pool here.</p></div>`;
    }
    const cols = ts.map((t) => `<th class="t" scope="col">${esc(targetLabel(t))}${t.alias ? '<span class="sr"> (existing account)</span>*' : ''}</th>`).join('');
    const rows = names.map((name) => {
      const ref = ts.map((t) => serverIn(t, name)).find((s) => s && s.fp === referenceFp(name));
      const cells = ts.map((t) => { const m = markFor(t, name); return `<td class="cell"><span class="mark ${m.cls}" title="${esc(m.title)}">${m.icon ? icon(m.icon) : ''}${m.text}<span class="sr">: ${esc(m.title)}</span></span></td>`; }).join('');
      return `<tr><th scope="row"><span class="mcp-name"><b>${esc(name)}</b><span class="sub" title="${esc(ref ? serverSummary(ref) : '')}">${esc(ref ? serverSummary(ref) : '')}</span></span></th>${cells}
        <td><span class="row-actions end"><button class="btn" type="button" data-act="mcp-copy" data-server="${esc(name)}">${icon('copy')}Copy…</button><button class="btn ghost" type="button" data-act="mcp-remove" data-server="${esc(name)}">${icon('trash')}Remove…</button></span></td></tr>`;
    }).join('');
    const table = names.length ? `<div class="table-wrap"><table class="table matrix"><thead><tr><th scope="col">Server</th>${cols}<th scope="col"><span class="sr">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      ${ts.some((t) => t.alias) ? '<p class="muted" style="margin-top:8px;font-size:12.5px">* your existing account (plain <code>claude</code>)</p>' : ''}` : '';
    const locals = ts.filter((t) => t.kind !== 'pool' && t.servers.some((s) => s.scope === 'local'));
    const localHtml = locals.length ? `<div class="local-list"><h2>Project servers</h2><p>These only load inside one project folder.</p>
      <table class="table"><tbody>${locals.flatMap((t) => t.servers.filter((s) => s.scope === 'local').map((s) => `
        <tr><td><div class="local-row"><div class="mcp-name"><b>${esc(s.name)}</b><div class="where">${esc(t.target)} · <code>${esc(s.project)}</code></div><span class="sub" title="${esc(serverSummary(s))}">${esc(serverSummary(s))}</span></div>
          <button class="btn" type="button" data-act="mcp-copy" data-server="${esc(s.name)}" data-from="${esc(t.target)}" data-project="${esc(s.project)}">${icon('copy')}Copy…</button></div></td></tr>`)).join('')}</tbody></table></div>` : '';
    return drift + intro + table + localHtml;
  }

  function viewDoctor() {
    if (!doctor) return '<p class="muted">Running checks…</p>';
    if (doctor.error) return `<div class="banner">${icon('xcircle')}${esc(doctor.error)}</div>`;
    const errs = doctor.filter((c) => c.status === 'error').length;
    const warns = doctor.filter((c) => c.status === 'warn').length;
    const fixable = doctor.filter((c) => c.fixable).length;
    const statusIcon = { ok: 'check', warn: 'alert', error: 'xcircle' };
    const groups = [...new Set(doctor.map((c) => c.group))];
    const summary = errs || warns
      ? `<span class="status ${errs ? 'error' : 'warn'}">${icon(errs ? 'xcircle' : 'alert')}${errs} error${errs === 1 ? '' : 's'}, ${warns} warning${warns === 1 ? '' : 's'}</span>`
      : `<span class="status ok">${icon('check')}All ${doctor.length} checks passed</span>`;
    return `<div class="summary">${summary}
        <span class="spacer"></span>
        <button class="btn" type="button" data-act="rerun">${icon('refresh')}Run again</button>
        ${fixable ? `<button class="btn primary" type="button" data-act="fix">Fix ${fixable} issue${fixable === 1 ? '' : 's'}…</button>` : ''}
      </div>
      ${groups.map((g) => {
        const checks = doctor.filter((c) => c.group === g);
        const issues = checks.filter((c) => c.status !== 'ok').length;
        // Passing groups collapse; groups with issues open with issues first.
        const ordered = [...checks].sort((a, b) => (a.status === 'ok') - (b.status === 'ok'));
        return `<details class="check-group"${issues ? ' open' : ''}><summary><h2>${esc(g)}</h2><span class="status ${issues ? 'warn' : 'ok'}">${issues ? `${issues} to look at` : `${checks.length} passed`}</span></summary><table class="table"><tbody>${ordered.map((c) => `
        <tr><td><div class="check"><span class="status ${esc(c.status)}">${icon(statusIcon[c.status] || 'info')}<span class="sr">${esc(c.status)}</span></span>
          <span>${esc(c.name)}</span>
          <span>${/^[~/]|^[A-Za-z]:\\/.test(c.message) ? `<code>${esc(c.message)}</code>` : esc(c.message)}${c.status !== 'ok' && (c.fix || c.cmd) ? `<span class="hint">${esc(c.fix || '')}${c.cmd ? ` <code>${esc(c.cmd)}</code>` : ''}</span>` : ''}</span>
          <span class="row-actions">${c.status === 'ok' ? '' : [
            c.fixable ? `<button class="btn" type="button" data-act="fix-one" data-name="${esc(c.name)}">${icon('wrench')}Fix</button>` : '',
            c.forceable ? `<button class="btn" type="button" data-act="fix-one" data-name="${esc(c.name)}" data-force="1">${icon('wrench')}Fix…</button>` : '',
            c.cmd ? `<button class="btn ghost" type="button" data-act="copy-cmd" data-cmd="${esc(c.cmd)}">${icon('copy')}Copy command</button>` : '',
          ].join('')}</span></div></td></tr>`).join('')}
      </tbody></table></details>`;
      }).join('')}`;
  }

  function backupTitle(op) {
    let m;
    if ((m = /^mcp-copy-(.+)$/.exec(op))) return `MCP copy from ${m[1]}`;
    if ((m = /^mcp-remove-(.+)$/.exec(op))) return `MCP remove ${m[1]}`;
    if (op === 'mcp-sync') return 'MCP sync with the pool';
    if (/^restore-/.test(op)) return 'Before a restore';
    return op;
  }
  function viewBackups() {
    if (!backups.length) return '';
    return `<div class="backups"><h2>Backups</h2><p>cchost saves a config file before every change it makes to it, here or in the terminal. The newest 30 are kept.</p>
      <table class="table"><tbody>${backups.map((b) => `<tr><td><div class="backup-row"><div class="what"><b>${esc(backupTitle(b.op))}</b> <span class="muted">${esc(relTime(b.createdAt))}</span><code>${esc(b.files.join(', '))}</code></div>
        <button class="btn" type="button" data-act="restore" data-id="${esc(b.id)}">${icon('undo')}Restore…</button></div></td></tr>`).join('')}</tbody></table></div>`;
  }
  function viewActivity() {
    if (!activity.length) {
      return `<div class="empty"><h2>No changes yet</h2><p>Every change you apply here is listed with each step it took, so you can see exactly what happened on disk. The list lasts until <code>cchost ui</code> stops.</p></div>` + viewBackups();
    }
    return `<div class="entries">${activity.map((e, i) => `
      <details class="entry"${i === 0 ? ' open' : ''}>
        <summary><span class="status ${e.ok ? 'ok' : 'error'}">${icon(e.ok ? 'check' : 'xcircle')}</span><b>${esc(e.title)}</b><span class="when">${esc(relTime(e.at))}</span></summary>
        ${linesHtml(e.lines, true, false)}
      </details>`).join('')}</div>` + viewBackups();
  }

  // --- Panel --------------------------------------------------------------
  const panel = $('#panel');
  const scrim = $('#scrim');
  let panelState = null; // { type, profile, plan }
  let lastFocus = null;

  function openPanel(state) {
    lastFocus = document.activeElement;
    panelState = state;
    panel.classList.add('entering');
    renderPanel();
    panel.classList.add('open');
    scrim.classList.add('open');
    clearTimeout(openPanel.t);
    openPanel.t = setTimeout(() => panel.classList.remove('entering'), 600);
    requestAnimationFrame(() => {
      const target = panel.querySelector('[autofocus]') || panel.querySelector('button, input');
      if (target) target.focus();
    });
  }
  function closePanel() {
    previewSeq++;
    panel.classList.remove('open');
    scrim.classList.remove('open');
    panelState = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function refreshOpenPanel() {
    if (!panelState || panelState.busy) return;
    if (panelState.profile && !data.profiles.find((p) => p.name === panelState.profile)) {
      if (!(panelState.plan && panelState.plan.done)) closePanel();
      return;
    }
    if (!panelState.plan && panelState.type === 'manage') renderPanel();
  }
  function profileByName(n) { return data && data.profiles.find((p) => p.name === n); }

  function groupState(p, g) {
    const sts = data.resources.filter((r) => r.group === g).map((r) => p.resources[r.id]);
    if (sts.every((s) => s === 'shared')) return 'shared';
    if (sts.every((s) => s !== 'shared')) return 'private';
    return 'mixed';
  }

  function planBox() {
    const plan = panelState.plan;
    if (!plan) return '';
    if (plan.loading) return plan.slow ? `<div class="plan"><div class="plan-head">${icon('loader', 'spin')}Working out what would change…</div></div>` : '';
    if (plan.error) return `<div class="plan failed"><div class="plan-head" id="f-err" role="alert">${icon('xcircle')}${esc(plan.error)}</div><div class="plan-foot"><span class="note"></span><button class="btn" type="button" data-act="plan-cancel">Dismiss</button></div></div>`;
    if (plan.done) {
      const ok = plan.entry.ok;
      return `<div class="plan ${ok ? 'done' : 'failed'}" tabindex="-1" id="plan-result">
        <div class="plan-head">${icon(ok ? 'check' : 'xcircle')}${ok ? 'Done' : 'Finished with errors'} — ${esc(plan.title)}<span class="tag">${esc(relTime(plan.entry.at))}</span></div>
        ${linesHtml(plan.entry.lines, true)}
        <div class="plan-foot"><span class="note">Also listed in Activity.</span><button class="btn" type="button" data-act="plan-cancel">Close</button></div></div>`;
    }
    const changes = plan.lines.filter((l) => l.kind === 'change').length;
    const blocked = plan.lines.some((l) => l.kind === 'error');
    const confirmName = plan.body.action === 'remove';
    const forget = confirmName && profileByName(plan.body.profile) && profileByName(plan.body.profile).alias;
    const held = plan.body.action === 'link' && !plan.body.backup
      ? plan.lines.filter((l) => l.code === 'private-content').length : 0;
    const warns = plan.lines.filter((l) => l.kind === 'warn').length;
    const note = forget ? 'Only the name is removed' : confirmName ? 'This cannot be undone'
      : held ? `${held === 1 ? '1 resource has its' : `${held} resources have their`} own content${changes ? `; ${changes} other change${changes === 1 ? '' : 's'} ready` : ''}`
      : changes ? `${changes} change${changes === 1 ? '' : 's'}`
      : warns ? 'Nothing can change — see the warnings above'
      : 'Already this way — nothing to change';
    return `<div class="plan${plan.stale ? ' stale' : ''}" id="plan-preview" ${plan.stale ? 'aria-busy="true"' : ''}>
      <div class="plan-head">${icon('info')}Preview — ${esc(plan.title)}<span class="tag">nothing changed yet</span></div>
      ${linesHtml(plan.lines, false)}
      ${held ? `<p class="plan-why">Sharing replaces this profile's copy with the shared one. <b>Share with backup</b> first renames the copy to <code>&lt;name&gt;.cchost-backup-&lt;time&gt;</code> in the profile folder, so nothing is deleted or merged.</p>` : ''}
      <div class="plan-foot">
        <span class="note">${note}</span>
        <button class="btn" type="button" data-act="plan-cancel">Cancel</button>
        ${held ? `<button class="btn${changes ? '' : ' primary'}" type="button" data-act="plan-backup" ${plan.stale ? 'disabled' : ''}>${icon('copy')}Share with backup</button>` : ''}
        ${held && !changes ? '' : `<button class="btn ${confirmName ? 'danger solid' : 'primary'}" type="button" data-act="plan-apply" ${plan.applying || plan.stale || blocked || (!changes && !confirmName) || (confirmName && panelState.confirm !== panelState.profile) ? 'disabled' : ''}>
          ${plan.applying ? icon('loader', 'spin') + 'Applying…' : forget ? 'Forget name' : confirmName ? 'Remove profile' : held ? `Apply ${changes}` : 'Apply'}
        </button>`}
      </div></div>`;
  }

  let previewSeq = 0;
  async function preview(body, title, section) {
    const seq = ++previewSeq;
    // Remember what opened the preview so Cancel can return focus there.
    panelState.returnFocus = focusKey(document.activeElement);
    const prev = panelState.plan;
    const sameSection = panelState.section === (section || null);
    const isNew = !(prev && sameSection && prev.lines && !prev.done);
    panelState.section = section || null;
    // Keep the open preview (dimmed) until the new one arrives; show loading only if slow.
    panelState.plan = isNew ? { loading: true, body } : { ...prev, body, title, stale: true };
    renderPanel();
    const slow = setTimeout(() => {
      if (seq !== previewSeq || !panelState || !panelState.plan || !panelState.plan.loading) return;
      panelState.plan.slow = true;
      renderPanel();
    }, 180);
    let result;
    try {
      const { lines } = await api('/api/preview', body);
      result = { body, title, lines };
    } catch (err) {
      result = { error: err.message };
    }
    clearTimeout(slow);
    if (seq !== previewSeq || !panelState) return; // a newer click won
    panelState.plan = result;
    if (result.error) announce(result.error);
    else {
      const n = result.lines.filter((l) => l.kind === 'change').length;
      announce(`Preview ready: ${title}. ${n} change${n === 1 ? '' : 's'}. Nothing has changed yet.`);
    }
    renderPanel();
    const box = $('#plan-preview') || panel.querySelector('.plan');
    if (box && isNew) box.classList.add('appear');
    if (box && panelState.type !== 'add') {
      box.setAttribute('tabindex', '-1');
      box.focus({ preventScroll: true });
    }
    if (box && box.getBoundingClientRect().top > innerHeight - 140) {
      box.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
  }

  async function apply() {
    const plan = panelState.plan;
    const body = { ...plan.body };
    if (body.action === 'remove') body.confirm = panelState.confirm;
    plan.applying = true;
    panelState.busy = true;
    renderPanel();
    try {
      const res = await api('/api/apply', body);
      const before = data;
      data = res.state;
      lastSync = Date.now();
      markChanged(before, data);
      panelState.plan = { done: true, title: plan.title, entry: res.entry };
      activity.unshift(res.entry);
      $('#count-activity').textContent = activity.length;
      $('#count-profiles').textContent = data.profiles.length || '';
      toast(res.entry.ok ? `${res.entry.title} — done` : `${res.entry.title} — finished with errors`);
      render();
      loadDoctor();
      loadMcp();
      loadBackups();
    } catch (err) {
      panelState.plan = { error: err.message };
    }
    panelState.busy = false;
    renderPanel();
    const r = $('#plan-result');
    if (r) r.focus({ preventScroll: false });
  }

  function markChanged(before, after) {
    changedBadges = new Set();
    for (const p of after.profiles) {
      const old = before && before.profiles.find((x) => x.name === p.name);
      for (const r of after.resources) {
        if (!old || old.resources[r.id] !== p.resources[r.id]) changedBadges.add(`${p.name}:${r.id}`);
      }
    }
    setTimeout(() => { changedBadges = new Set(); }, 1800);
  }

  // Identify the focused control so a re-render can put focus back on its
  // replacement (WCAG 2.4.3): by id, or by its data-act/group/to/profile.
  function focusKey(el) {
    if (!el || !panel.contains(el)) return null;
    if (el.id) return `#${CSS.escape(el.id)}`;
    const d = el.dataset || {};
    if (!d.act) return null;
    return ['act', 'group', 'to', 'profile', 'share'].filter((k) => d[k])
      .map((k) => `[data-${k}="${CSS.escape(d[k])}"]`).join('');
  }
  function renderPanel() {
    if (!panelState) return;
    const active = document.activeElement;
    const key = focusKey(active);
    const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    renderPanelInner();
    if (!panel.classList.contains('open')) return;
    let target = key && panel.querySelector(key);
    if (target && target.disabled) target = null;
    if (!target && panelState.plan) target = panel.querySelector('#plan-result, #plan-preview, .plan');
    if (!target && key) target = panel.querySelector('[data-act="close"]');
    if (target) {
      if (!target.hasAttribute('tabindex') && !/^(BUTTON|INPUT|A)$/.test(target.tagName)) target.setAttribute('tabindex', '-1');
      target.focus({ preventScroll: true });
      if (caret !== null) { try { target.setSelectionRange(caret, caret); } catch { /* not text */ } }
    }
  }
  function renderPanelInner() {
    const t = panelState.type;
    if (t === 'manage') panel.innerHTML = panelManage();
    if (t === 'add') {
      panel.innerHTML = panelAdd();
      // The token is set as a property, never written into the markup.
      const tok = document.getElementById('f-token');
      if (tok) tok.value = panelState.form.endpoint.auth_token;
    }
    if (t === 'remove') panel.innerHTML = panelRemove();
    if (t === 'fix') panel.innerHTML = panelFix();
    if (t === 'mcp-copy') panel.innerHTML = panelMcpCopy();
    if (t === 'mcp-remove') panel.innerHTML = panelMcpRemove();
    if (t === 'simple') panel.innerHTML = head(esc(panelState.title), panelState.sub || '') + `<div class="panel-body"><div class="section">${panelState.note ? `<p>${esc(panelState.note)}</p>` : ''}${planBox()}</div></div>`;
  }

  function head(title, sub) {
    return `<div class="panel-head"><div><h2 id="panel-title">${title}</h2>${sub ? `<p class="meta">${sub}</p>` : ''}</div>
      <button class="btn ghost icon" type="button" data-act="close" aria-label="Close panel">${icon('x')}</button></div>`;
  }

  function panelManage() {
    const p = profileByName(panelState.profile);
    if (!p) return head('Profile not found') + '<div class="panel-body"><p class="muted">It may have been removed from disk.</p></div>';
    const busy = Boolean(panelState.plan && panelState.plan.applying);
    const rows = Object.keys(data.groups).map((g) => {
      const st = groupState(p, g);
      const rs = data.resources.filter((r) => r.group === g);
      // While a preview for this group is open, show the side the user picked.
      const plan = panelState.section === 'share' && panelState.plan;
      const pending = plan && plan.body && !plan.done && plan.body.groups[0] === g
        ? (plan.body.action === 'link' ? 'shared' : 'private') : null;
      const shown = pending || st;
      const segBtn = (to, text) => `<button type="button" class="${pending === to ? 'target' : ''}" aria-pressed="${shown === to}" data-act="set-group" data-group="${g}" data-to="${to}" ${busy ? 'disabled' : ''}>${text}</button>`;
      return `<div class="share-row">
        <div><div class="name">${GROUP_TEXT[g]}</div><div class="help">${esc(GROUP_HELP[g])}</div>
          <div class="badges">${rs.map((r) => badge(p, r)).join('')}</div></div>
        <div><div class="seg" role="group" aria-label="${GROUP_TEXT[g]} sharing">${segBtn('shared', 'Shared')}${segBtn('private', 'Private')}</div>
          <span class="now${pending ? '' : ' idle'}"${pending ? '' : ' aria-hidden="true"'}>Now: ${st === 'mixed' ? 'mixed' : st}</span></div></div>`;
    }).join('');
    return head(esc(p.name), metaOf(p)) + `<div class="panel-body">
      <div class="section"><h3>Sharing</h3><p>Shared resources live in <code>~/.claude</code> and every sharing profile sees the same content. Private ones belong to this profile only. Pick a side to preview the change.</p>${rows}
        ${panelState.section === 'share' ? planBox() : ''}</div>
      <div class="section"><h3>Copy from ~/.claude</h3><p>Add what <code>~/.claude</code> has into this profile's private resources. Shared resources are skipped — they already see it.</p>
        <div class="checks"><label><input type="checkbox" id="copy-force"><span><b>Overwrite items this profile already has</b><span>Off: existing items are kept and skipped.</span></span></label></div>
        <div class="actions"><button class="btn" type="button" data-act="copy" ${busy ? 'disabled' : ''}>${icon('copy')}Preview copy</button></div>
        ${panelState.section === 'copy' ? planBox() : ''}</div>
      <div class="section"><div class="danger-box"><h3>Remove profile</h3><p class="muted">Deletes this profile's login, sessions and private resources. Shared content in <code>~/.claude</code> is kept.</p>
        <div><button class="btn danger" type="button" data-act="remove" data-profile="${esc(p.name)}">${icon('trash')}Remove ${esc(p.name)}…</button></div></div></div>
    </div>`;
  }

  function panelRemove() {
    const p = profileByName(panelState.profile);
    const name = panelState.profile;
    const done = panelState.plan && panelState.plan.done;
    if (p && p.alias || (done && !p && panelState.alias)) {
      panelState.alias = true;
      return head(`Forget the name ${esc(name)}`, 'Your existing account') + `<div class="panel-body">
      <div class="section"><p>cchost stops calling your existing account <b>${esc(name)}</b>. The account itself, in <code>~/.claude</code> and <code>~/.claude.json</code>, is not touched: plain <code>claude</code> keeps working.</p>
      ${done ? '' : `<div class="field"><label for="confirm-name">Type <b>${esc(name)}</b> to confirm</label>
        <input class="input" id="confirm-name" autocomplete="off" spellcheck="false" value="${esc(panelState.confirm || '')}" autofocus></div>`}
      ${planBox()}</div></div>`;
    }
    return head(`Remove ${esc(name)}`, p ? metaOf(p) : '') + `<div class="panel-body">
      <div class="section"><p>This permanently deletes <code>~/.claude-profiles/${esc(name)}</code>: its login, sessions and anything private. Shared content in <code>~/.claude</code> stays for the other profiles.</p>
      ${done ? '' : `<div class="field"><label for="confirm-name">Type <b>${esc(name)}</b> to confirm</label>
        <input class="input" id="confirm-name" autocomplete="off" spellcheck="false" value="${esc(panelState.confirm || '')}" autofocus></div>`}
      ${planBox()}</div></div>`;
  }

  function panelAdd() {
    const f = panelState.form;
    const nameErr = Boolean(panelState.plan && panelState.plan.error && /name/i.test(panelState.plan.error));
    const e = f.endpoint;
    const ex = data.existing || {};
    const canName = ex.found && !ex.name;
    return head('Add profile', f.existing ? 'Names the account you already use with plain claude' : 'Creates a new Claude Code login under ~/.claude-profiles') + `<div class="panel-body">
      <div class="section">
        <div class="field"><label for="f-name">Name</label>
          <input class="input" id="f-name" value="${esc(f.name)}" placeholder="work" autocomplete="off" spellcheck="false" autofocus required
            aria-describedby="f-name-help${nameErr ? ' f-err' : ''}"${nameErr ? ' aria-invalid="true"' : ''}>
          <span class="help" id="f-name-help">Used as <code>cchost use ${f.name ? esc(f.name) : '&lt;name&gt;'}</code>. No spaces or slashes.</span></div>
        <div class="field"><span class="label">Login</span>
          <div class="choice" role="radiogroup" aria-label="Login type">
            <label><input type="radio" name="f-kind" value="subscription" ${!f.custom && !f.existing ? 'checked' : ''}><b>Anthropic subscription</b><span>Log in with your Claude account on first use.</span></label>
            <label><input type="radio" name="f-kind" value="endpoint" ${f.custom ? 'checked' : ''}><b>Custom endpoint</b><span>Any Anthropic-compatible API with a token.</span></label>
            ${canName ? `<label><input type="radio" name="f-kind" value="existing" ${f.existing ? 'checked' : ''}><b>My existing account</b><span>The one plain <code>claude</code> uses${ex.email ? ` (${esc(ex.email)})` : ''}. Nothing is moved.</span></label>` : ''}
          </div></div>
        ${f.custom ? `
        <div class="field"><label for="f-url">Base URL</label><input class="input" id="f-url" value="${esc(e.base_url)}" placeholder="https://api.moonshot.ai/anthropic" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="f-token">API token</label><input class="input" id="f-token" type="password" autocomplete="off" spellcheck="false">
          <span class="help">Stored in the profile with user-only permissions. Never shown again here.</span></div>
        <div class="field"><label for="f-model">Model <span class="muted">(optional)</span></label><input class="input" id="f-model" value="${esc(e.model)}" placeholder="kimi-k2.5" autocomplete="off" spellcheck="false"></div>` : ''}
      </div>
      ${f.existing ? `<div class="section">${panelState.plan ? planBox() : '<p class="plan-hint">Enter a name to see what will happen.</p>'}</div></div>` : `<div class="section"><h3>Sharing</h3><p>Unchecked groups start private and empty — nothing is copied in.</p>
        <div class="checks">${Object.keys(data.groups).map((g) => `
          <label><input type="checkbox" data-share="${g}" ${f.share[g] ? 'checked' : ''}><span><b>Share ${GROUP_TEXT[g].toLowerCase()}</b><span>${esc(GROUP_HELP[g])}</span></span></label>`).join('')}
        </div>
        ${panelState.plan ? planBox() : `<p class="plan-hint">${f.custom ? 'Enter a name, base URL and token' : 'Enter a name'} to see exactly what will be created.</p>`}
      </div></div>`}`;
  }

  function panelFix() {
    const f = panelState.fix || {};
    const title = f.name ? `Fix ${esc(f.name)}` : 'Fix doctor issues';
    const sub = f.name ? esc(f.description || '') : 'Applies the safe fixes <code>cchost doctor --fix</code> would';
    const note = f.force
      ? `<div class="confirm-note">${icon('alert')}<span>This fix changes something cchost won't change on its own (the CLI needs <code>--force</code>). Read the preview, then apply to confirm.</span></div>`
      : '';
    return head(title, sub) + `<div class="panel-body"><div class="section">${note}${planBox()}</div></div>`;
  }

  // --- MCP panels ---------------------------------------------------------------
  function openMcpCopy(server, from, project) {
    const scope = project ? 'local' : 'user';
    const has = (t) => (scope === 'local' ? t.servers.some((s) => s.scope === 'local' && s.name === server && s.project === project) : Boolean(serverIn(t, server)));
    const sources = mcp.targets.filter(has);
    const src = from || (sources.find((t) => t.kind !== 'pool') || sources[0] || {}).target;
    openPanel({ type: 'mcp-copy', form: { server, from: src, scope, project: project || null, to: {}, force: false } });
  }
  function mcpCopyBody() {
    const f = panelState.form;
    const body = { action: 'mcp-copy', from: f.from, to: Object.keys(f.to).filter((k) => f.to[k]), servers: [f.server], scope: f.scope, force: f.force };
    if (f.project) body.project = f.project;
    return body;
  }
  function panelMcpCopy() {
    const f = panelState.form;
    const local = f.scope === 'local';
    const sources = mcp.targets.filter((t) => (local ? t.servers.some((s) => s.scope === 'local' && s.name === f.server && s.project === f.project) : serverIn(t, f.server)));
    const dests = mcp.targets.filter((t) => t.target !== f.from && !(local && t.kind === 'pool'));
    const srcHtml = sources.length > 1 ? `<div class="field"><span class="label">Copy from</span><div class="targets" role="radiogroup" aria-label="Copy from">${sources.map((t) => `
      <label><input type="radio" name="cp-from" value="${esc(t.target)}" ${t.target === f.from ? 'checked' : ''}><span>${esc(targetLabel(t))}${t.alias ? ' <span class="muted">(existing account)</span>' : ''}</span>${local ? '' : (() => { const m = markFor(t, f.server); return `<span class="mark ${m.cls}">${m.icon ? icon(m.icon) : ''}${m.text}</span>`; })()}</label>`).join('')}</div></div>`
      : `<p>From <b>${esc(f.from === 'pool' ? 'the pool' : f.from)}</b>${local ? ` · project <code>${esc(f.project)}</code>` : ''}.</p>`;
    const destHtml = `<div class="field"><span class="label">Copy to</span><div class="targets">${dests.map((t) => {
      const m = local ? null : markFor(t, f.server);
      const help = t.kind === 'pool' ? ' <span class="muted">— every profile that shares mcp.json</span>' : t.alias ? ' <span class="muted">(existing account)</span>' : '';
      return `<label><input type="checkbox" data-to="${esc(t.target)}" ${f.to[t.target] ? 'checked' : ''}><span>${esc(targetLabel(t))}${help}</span>${m ? `<span class="mark ${m.cls}">${m.icon ? icon(m.icon) : ''}${m.text}</span>` : ''}</label>`;
    }).join('')}</div></div>`;
    const anyTo = Object.values(f.to).some(Boolean);
    return head(`Copy ${esc(f.server)}`, local ? 'Project server' : 'MCP server') + `<div class="panel-body"><div class="section">
      ${srcHtml}${destHtml}
      <div class="checks"><label><input type="checkbox" id="cp-force" ${f.force ? 'checked' : ''}><span><b>Replace a different server with the same name</b><span>Off: a profile that has its own "${esc(f.server)}" keeps it.</span></span></label></div>
      ${panelState.plan ? planBox() : `<p class="plan-hint">${anyTo ? 'Working out what would change…' : 'Pick where to copy it to see exactly what will change.'}</p>`}
      </div></div>`;
  }
  let mcpTimer = null;
  function mcpCopyInput(el) {
    const f = panelState.form;
    if (el.name === 'cp-from') { f.from = el.value; delete f.to[el.value]; renderPanelKeepFocus(); }
    if (el.dataset.to) f.to[el.dataset.to] = el.checked;
    if (el.id === 'cp-force') f.force = el.checked;
    clearTimeout(mcpTimer);
    mcpTimer = setTimeout(() => {
      if (!panelState || panelState.type !== 'mcp-copy') return;
      const body = mcpCopyBody();
      if (!body.to.length) { panelState.plan = null; renderPanelKeepFocus(); return; }
      preview(body, `Copy ${f.server} to ${body.to.map((x) => (x === 'pool' ? 'the pool' : x)).join(', ')}`);
    }, 150);
  }
  function openMcpRemove(server) {
    const have = mcp.targets.filter((t) => serverIn(t, server));
    openPanel({ type: 'mcp-remove', server, target: have.length === 1 ? have[0].target : null });
    if (have.length === 1) previewMcpRemove();
  }
  function previewMcpRemove() {
    preview({ action: 'mcp-remove', target: panelState.target, server: panelState.server }, `Remove ${panelState.server} from ${panelState.target === 'pool' ? 'the pool' : panelState.target}`);
  }
  function panelMcpRemove() {
    const have = mcp.targets.filter((t) => serverIn(t, panelState.server));
    return head(`Remove ${esc(panelState.server)}`, 'MCP server') + `<div class="panel-body"><div class="section">
      <div class="field"><span class="label">Remove from</span><div class="targets" role="radiogroup" aria-label="Remove from">${have.map((t) => `
        <label><input type="radio" name="rm-target" value="${esc(t.target)}" ${panelState.target === t.target ? 'checked' : ''}><span>${esc(targetLabel(t))}${t.kind === 'pool' ? ' <span class="muted">— also removes the copies the pool gave profiles</span>' : t.alias ? ' <span class="muted">(existing account)</span>' : ''}</span></label>`).join('')}</div></div>
      ${panelState.plan ? planBox() : '<p class="plan-hint">Pick where to remove it from to see what will change.</p>'}
      </div></div>`;
  }

  // Add form → preview, debounced as the user types.
  let addTimer = null;
  function addBody() {
    const f = panelState.form;
    if (f.existing) return { action: 'add', name: f.name.trim(), existing: true };
    const body = { action: 'add', name: f.name.trim(), private: Object.keys(f.share).filter((g) => !f.share[g]) };
    if (f.custom) body.endpoint = { base_url: f.endpoint.base_url, auth_token: f.endpoint.auth_token, model: f.endpoint.model };
    return body;
  }
  function schedulePreviewAdd() {
    clearTimeout(addTimer);
    addTimer = setTimeout(() => {
      if (!panelState || panelState.type !== 'add') return;
      const body = addBody();
      const f = panelState.form;
      const incomplete = !body.name || (f.custom && (!f.endpoint.base_url.trim() || !f.endpoint.auth_token.trim()));
      if (incomplete) { panelState.plan = null; renderPanelKeepFocus(); return; }
      api('/api/preview', body).then(({ lines }) => {
        if (!panelState || panelState.type !== 'add') return;
        panelState.plan = { body, title: `Add profile ${body.name}`, lines };
        renderPanelKeepFocus();
      }).catch((err) => {
        if (!panelState || panelState.type !== 'add') return;
        panelState.plan = { error: err.message };
        renderPanelKeepFocus();
      });
    }, 250);
  }
  const renderPanelKeepFocus = () => renderPanel();

  // --- Events -------------------------------------------------------------
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-act], [data-theme-set]');
    if (!t) return;
    if (t.dataset.themeSet) { setTheme(t.dataset.themeSet); announce(`Theme: ${t.dataset.themeSet}`); return; }
    const act = t.dataset.act;
    if (act === 'manage') openPanel({ type: 'manage', profile: t.dataset.profile });
    if (act === 'remove') {
      const name = t.dataset.profile;
      openPanel({ type: 'remove', profile: name, confirm: '' });
      preview({ action: 'remove', profile: name }, `Remove ${name}`);
    }
    if (act === 'add' || act === 'name-existing') {
      openPanel({ type: 'add', form: { name: '', custom: false, existing: act === 'name-existing', endpoint: { base_url: '', auth_token: '', model: '' }, share: { projects: true, tools: true, config: true } } });
    }
    if (act === 'mcp-copy') openMcpCopy(t.dataset.server, t.dataset.from, t.dataset.project);
    if (act === 'mcp-remove') openMcpRemove(t.dataset.server);
    if (act === 'mcp-sync') {
      openPanel({ type: 'simple', title: 'Sync pool MCP servers', sub: 'Writes the pool\'s servers into every profile that shares mcp.json' });
      preview({ action: 'mcp-sync' }, 'Sync pool MCP servers');
    }
    if (act === 'restore') {
      const id = t.dataset.id;
      const b = backups.find((x) => x.id === id);
      openPanel({ type: 'simple', title: 'Restore backup', sub: b ? `${esc(backupTitle(b.op))} · ${esc(relTime(b.createdAt))}` : esc(id), note: 'Puts these files back as they were before that change. The files as they are now are backed up first, so this can be undone too.' });
      preview({ action: 'restore', id }, 'Restore backup');
    }
    if (act === 'close') closePanel();
    if (act === 'set-group') {
      const p = profileByName(panelState.profile);
      const g = t.dataset.group;
      const to = t.dataset.to;
      const plan = panelState.plan;
      const open = panelState.section === 'share' && plan && !plan.done && !plan.applying;
      if (to === groupState(p, g)) {
        // Clicking the current side cancels this group's pending change.
        if (open && plan.body && plan.body.groups && plan.body.groups[0] === g) {
          previewSeq++;
          panelState.plan = null;
          panelState.section = null;
          renderPanel();
          announce('Change cancelled. Nothing was changed.');
        }
        return;
      }
      if (open && plan.body && plan.body.groups[0] === g && (plan.body.action === 'link' ? 'shared' : 'private') === to) return;
      preview({ action: to === 'shared' ? 'link' : 'unlink', profile: p.name, groups: [g] },
        `${to === 'shared' ? 'Share' : 'Make private'}: ${GROUP_TEXT[g].toLowerCase()}`, 'share');
    }
    if (act === 'copy') {
      const force = $('#copy-force').checked;
      preview({ action: 'copy', profile: panelState.profile, force }, `Copy from ~/.claude${force ? ' (overwrite)' : ''}`, 'copy');
    }
    if (act === 'plan-backup') {
      const b = panelState.plan.body;
      preview({ ...b, backup: true }, `Share with backup: ${GROUP_TEXT[b.groups[0]].toLowerCase()}`, panelState.section);
    }
    if (act === 'plan-cancel') {
      previewSeq++;
      const wasRemoveDone = panelState.type === 'remove' && panelState.plan && panelState.plan.done;
      panelState.plan = null;
      if (['remove', 'fix', 'simple', 'mcp-remove'].includes(panelState.type)) { closePanel(); return; }
      if (wasRemoveDone) { closePanel(); return; }
      const back = panelState.returnFocus;
      renderPanel();
      const el = back && panel.querySelector(back);
      if (el) el.focus();
    }
    if (act === 'plan-apply') apply();
    if (act === 'rerun') loadDoctor();
    if (act === 'fix') {
      openPanel({ type: 'fix' });
      preview({ action: 'doctor-fix' }, 'Apply safe doctor fixes');
    }
    if (act === 'fix-one') {
      const name = t.dataset.name;
      const force = t.dataset.force === '1';
      const check = Array.isArray(doctor) && doctor.find((c) => c.name === name);
      openPanel({ type: 'fix', fix: { name, force, description: check && check.fix } });
      preview({ action: 'doctor-fix', name, force }, `Fix ${name}`);
    }
    if (act === 'copy-cmd') {
      const cmd = t.dataset.cmd;
      const done = () => { toast('Command copied', false); announce('Command copied to the clipboard.'); };
      if (navigator.clipboard) navigator.clipboard.writeText(cmd).then(done, () => toast(cmd, false));
      else toast(cmd, false);
    }
    if (act === 'copy-update') {
      const done = () => { toast(`Copied: ${UPDATE_CMD}`, false); announce('Update command copied. Run it in a terminal, then restart cchost ui.'); };
      if (navigator.clipboard) navigator.clipboard.writeText(UPDATE_CMD).then(done, () => toast(UPDATE_CMD, false));
      else toast(UPDATE_CMD, false);
    }
    if (act === 'account') { toggleMenu(); return; }
    if (act === 'logout') {
      fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CCHost': '1' }, body: '{}' })
        .finally(() => location.replace('/'));
    }
    if (act === 'collapse') toggleCollapse();
  });

  document.addEventListener('input', (ev) => {
    if (!panelState) return;
    const el = ev.target;
    if (panelState.type === 'remove' && el.id === 'confirm-name') {
      panelState.confirm = el.value;
      const btn = panel.querySelector('[data-act="plan-apply"]');
      if (btn && panelState.plan && !panelState.plan.applying) btn.disabled = el.value !== panelState.profile;
      return;
    }
    if (panelState.type === 'mcp-copy') { mcpCopyInput(el); return; }
    if (panelState.type === 'mcp-remove' && el.name === 'rm-target') { panelState.target = el.value; previewMcpRemove(); return; }
    if (panelState.type !== 'add') return;
    const f = panelState.form;
    if (el.id === 'f-name') f.name = el.value;
    if (el.id === 'f-url') f.endpoint.base_url = el.value;
    if (el.id === 'f-token') f.endpoint.auth_token = el.value;
    if (el.id === 'f-model') f.endpoint.model = el.value;
    if (el.name === 'f-kind') { f.custom = el.value === 'endpoint'; f.existing = el.value === 'existing'; renderPanelKeepFocus(); }
    if (el.dataset.share) f.share[el.dataset.share] = el.checked;
    schedulePreviewAdd();
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && panelState && !panelState.busy) closePanel();
    if (ev.key === 'Tab' && panelState) {
      const items = [...panel.querySelectorAll('button:not([disabled]), input, [tabindex="0"]')];
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });
  scrim.addEventListener('click', () => { if (panelState && !panelState.busy) closePanel(); });
  $('#refresh').addEventListener('click', () => { loadState(); if (view === 'doctor') loadDoctor(); });

  // --- Sidebar ----------------------------------------------------------------
  const desktop = matchMedia('(min-width: 861px)');
  function setCollapsed(on, save = true) {
    $('.app').classList.toggle('collapsed', on);
    const b = $('#collapse');
    b.setAttribute('aria-expanded', String(!on));
    b.setAttribute('aria-label', on ? 'Expand sidebar' : 'Collapse sidebar');
    b.dataset.tip = `${on ? 'Expand' : 'Collapse'} sidebar  [`;
    hideTip();
    if (save) { try { localStorage.setItem('cchost-sidebar', on ? 'collapsed' : 'open'); } catch { /* storage blocked */ } }
  }
  function toggleCollapse() {
    if (!desktop.matches) return;
    setCollapsed(!$('.app').classList.contains('collapsed'), !narrow.matches);
    announce($('.app').classList.contains('collapsed') ? 'Sidebar collapsed' : 'Sidebar expanded');
  }
  // Narrow windows get the rail without overwriting the saved choice.
  const narrow = matchMedia('(max-width: 1100px)');
  function savedCollapsed() { try { return localStorage.getItem('cchost-sidebar') === 'collapsed'; } catch { return false; } }
  setCollapsed(narrow.matches || savedCollapsed(), false);
  narrow.addEventListener('change', () => setCollapsed(narrow.matches || savedCollapsed(), false));
  setTimeout(() => document.documentElement.classList.add('ready'), 50);

  const tip = $('#tip');
  function showTip(el) {
    if (!desktop.matches || !$('.app').classList.contains('collapsed')) return;
    const r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip;
    tip.style.left = `${r.right + 10}px`;
    tip.style.top = `${r.top + r.height / 2 - 13}px`;
    tip.classList.add('show');
  }
  function hideTip() { $('#tip').classList.remove('show'); }
  const side = $('.side');
  side.addEventListener('pointerover', (ev) => { const el = ev.target.closest('[data-tip]'); if (el) showTip(el); });
  side.addEventListener('pointerout', (ev) => { const el = ev.target.closest('[data-tip]'); if (el && !el.contains(ev.relatedTarget)) hideTip(); });
  side.addEventListener('focusin', (ev) => { const el = ev.target.closest('[data-tip]'); if (el && ev.target.matches(':focus-visible')) showTip(el); });
  side.addEventListener('focusout', hideTip);

  document.addEventListener('keydown', (ev) => {
    if (ev.key !== '[' || ev.metaKey || ev.ctrlKey || ev.altKey || panelState) return;
    if (ev.target instanceof Element && ev.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    ev.preventDefault();
    toggleCollapse();
  });

  const menu = $('#account-menu');
  function placeMenu() {
    const r = $('#account').getBoundingClientRect();
    const rail = desktop.matches && $('.app').classList.contains('collapsed');
    const inSidebar = desktop.matches && !rail;
    menu.classList.toggle('in-sidebar', inSidebar);
    menu.style.width = inSidebar ? `${r.width}px` : '';
    let left = rail ? r.right + 8 : r.left;
    const h = menu.offsetHeight;
    let top = rail ? r.bottom - h : r.top - h - 6;
    if (!desktop.matches) { left = r.right - menu.offsetWidth; top = r.bottom + 6; }
    menu.style.left = `${Math.max(8, Math.min(left, innerWidth - menu.offsetWidth - 8))}px`;
    menu.style.top = `${Math.max(8, top)}px`;
    menu.style.setProperty('--origin', desktop.matches ? (rail ? 'bottom left' : 'bottom center') : 'top right');
  }
  function openMenu() {
    hideTip();
    menu.hidden = false;
    placeMenu();
    $('#account').setAttribute('aria-expanded', 'true');
    (menu.querySelector('[aria-checked="true"]') || menu.querySelector('button')).focus();
  }
  function closeMenu(refocus = true) {
    if (menu.hidden) return;
    menu.hidden = true;
    $('#account').setAttribute('aria-expanded', 'false');
    if (refocus) $('#account').focus();
  }
  function toggleMenu() { if (menu.hidden) openMenu(); else closeMenu(); }
  document.addEventListener('pointerdown', (ev) => {
    if (!menu.hidden && !menu.contains(ev.target) && !ev.target.closest('#account')) closeMenu(false);
  });
  menu.addEventListener('keydown', (ev) => {
    const items = [...menu.querySelectorAll('button')];
    const i = items.indexOf(document.activeElement);
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); closeMenu(); }
    else if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (ev.key === 'Tab') closeMenu(false);
  });
  addEventListener('resize', () => { if (!menu.hidden) placeMenu(); });

  async function loadSession() {
    try {
      const s = await api('/api/session');
      const t = new Date(s.expires).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      for (const id of ['#who-user', '#menu-user']) $(id).textContent = s.user;
      for (const id of ['#who-exp', '#menu-exp']) $(id).textContent = `Session ends ${t}`;
      for (const id of ['#avatar', '#menu-avatar']) $(id).textContent = (s.user || '?').slice(0, 1);
      $('#account').dataset.tip = `${s.user} · session ends ${t}`;
    } catch { /* api() already handles sign-out */ }
  }

  // --- Theme ----------------------------------------------------------------
  function setTheme(mode) {
    try { localStorage.setItem('cchost-theme', mode); } catch { /* storage blocked */ }
    if (mode === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.themeSet === mode)));
  }
  let savedTheme = 'system';
  try { savedTheme = localStorage.getItem('cchost-theme') || 'system'; } catch { /* storage blocked */ }
  setTheme(savedTheme);

  function announce(msg) {
    const el = $('#announce');
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 30);
  }

  // --- Toast ----------------------------------------------------------------
  let toastTimer = null;
  function toast(msg, withLink = true) {
    const el = $('#toast');
    el.innerHTML = `${esc(msg)}${withLink ? ' <a href="#activity">View</a>' : ''}`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  // --- Routing & refresh ------------------------------------------------------
  function route() {
    const v = (location.hash || '#profiles').slice(1);
    view = ['profiles', 'pool', 'mcp', 'doctor', 'activity'].includes(v) ? v : 'profiles';
    render();
    if (view === 'mcp') loadMcp();
    if (view === 'activity') loadBackups();
    if (view === 'doctor' && !Array.isArray(doctor)) loadDoctor();
    if (view === 'activity') loadActivity();
  }
  window.addEventListener('hashchange', route);
  setInterval(() => {
    renderSync();
    if (document.visibilityState === 'visible' && !(panelState && panelState.busy) && Date.now() - lastSync > 5000) {
      loadState();
      if (view === 'mcp' && !panelState) loadMcp();
    }
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadState(); });

  route();
  loadSession();
  loadState();
  loadDoctor();
  loadMcp();
})();
</script>
</body>
</html>
