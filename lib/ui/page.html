<html lang="en">

<title>cchost</title>
<style nonce="__NONCE__">
/*__TOKENS__*/
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in srgb, var(--primary) 28%, transparent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
a { color: var(--primary); text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Shell: icons keep the same x in both rail states; only width and labels change. */
.app { --side-w: 240px; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 240ms var(--ease); }
.side {
  position: sticky; top: 0; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column; gap: 2px;
  padding: 12px; background: var(--surface); border-right: 1px solid var(--border);
}
.fold { white-space: nowrap; transition: opacity 160ms var(--ease) 60ms, visibility 0s linear 0s; }
.brand { display: flex; align-items: center; gap: 10px; height: 36px; margin-bottom: 14px; padding-left: 9px; font-weight: 650; font-size: 15px; }
.brand svg { width: 22px; height: 22px; flex: none; }
.logo .tile { fill: var(--primary); }
.logo .node { fill: var(--primary-fg); }
.logo .spoke { stroke: var(--primary-fg); stroke-width: 1.8; stroke-linecap: round; opacity: 0.7; }
.brand small { margin-left: 6px; color: var(--text-3); font-weight: 500; font-size: 12px; }
.row {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 12px; border-radius: 6px;
  border: 0; background: transparent; color: var(--text-2); text-decoration: none; text-align: left;
  font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: background 140ms, color 140ms;
}
.row:hover { background: var(--surface-2); color: var(--text); }
.row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.nav a[aria-current="page"] { background: var(--shared-bg); color: var(--shared-fg); }
.nav a[aria-current="page"] .count { color: inherit; }
.nav { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.nav a .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
.nav a .count.warn { color: var(--warn); }
.nav a .count.err { color: var(--err); }
.side-foot { margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding-top: 10px; border-top: 1px solid var(--border); }
.row.update-row { min-height: 44px; color: var(--shared-fg); }
.row.update-row[hidden] { display: none; }
.row.update-row > .fold { display: grid; line-height: 1.3; }
.row.update-row b { font-size: 13px; font-weight: 600; }
.row.update-row span span { font-size: 12px; color: var(--text-3); }
.row .kbd { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 3px 5px; }
.row.account { min-height: 44px; padding-left: 8px; gap: 10px; }
.row.account[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
.avatar {
  flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
  font-size: 12px; font-weight: 650; text-transform: uppercase;
}
.avatar.lg { width: 32px; height: 32px; font-size: 13px; }
.who { display: grid; min-width: 0; line-height: 1.3; }
.who b { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12px; font-weight: 400; color: var(--text-3); }
.row .updown { margin-left: auto; width: 14px; height: 14px; color: var(--text-3); }
.menu {
  position: fixed; z-index: 40; width: 248px; padding: 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-toast);
  transform-origin: var(--origin, bottom left); animation: menu-in 140ms var(--ease);
}
.menu[hidden] { display: none; }
@keyframes menu-in { from { opacity: 0; transform: scale(0.97); } }
.menu-head { display: flex; align-items: center; gap: 10px; padding: 8px 8px 10px; }
.menu-head > span:last-child { display: grid; min-width: 0; line-height: 1.35; }
.menu-head b { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.menu-head span span { font-size: 12px; color: var(--text-3); }
.menu.in-sidebar .menu-head, .menu.in-sidebar .menu-head + .menu-sep { display: none; }
.menu-sep { height: 1px; margin: 4px -6px; background: var(--border); }
.menu-label { padding: 8px 8px 6px; font-size: 12px; font-weight: 500; color: var(--text-3); }
.menu .theme { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 2px 6px; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); }
.menu .theme button {
  display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; height: 28px; padding: 0 2px;
  border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; font-weight: 550; white-space: nowrap; cursor: pointer;
  transition: background 140ms, color 140ms, box-shadow 140ms;
}
.menu .theme button svg.i { width: 14px; height: 14px; }
.menu .theme button:hover { color: var(--text); }
.menu .theme button[aria-checked="true"] { background: var(--surface); color: var(--shared-fg); box-shadow: var(--shadow-sm); }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--text-2); font: inherit; font-weight: 500; text-align: left; cursor: pointer;
}
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-2); color: var(--text); }
.menu-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
html:not(.ready) .app, html:not(.ready) .fold { transition: none; }
.tip {
  position: fixed; z-index: 30; pointer-events: none; padding: 5px 8px; border-radius: 6px;
  background: var(--text); color: var(--bg); font-size: 12px; font-weight: 550; white-space: nowrap;
  opacity: 0; transform: translateX(-4px); transition: opacity 120ms var(--ease), transform 120ms var(--ease);
}
.tip.show { opacity: 1; transform: none; }
@media (min-width: 861px) {
  .app.collapsed { --side-w: 64px; }
  .app.collapsed .fold { opacity: 0; visibility: hidden; transition: opacity 100ms var(--ease), visibility 0s linear 100ms; }
  .app.collapsed .row .collapse-i { transform: scaleX(-1); }
}

main { min-width: 0; }
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  height: 60px; padding: 0 32px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--border);
}
.top h1 { font-size: 20px; font-weight: 650; }
.top .sync { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12.5px; }
.content { padding: 24px 32px 64px; max-width: 1280px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 550; font-size: 13px; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: background 120ms, border-color 120ms, color 120ms, transform 120ms;
}
.btn:hover { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { color: var(--err-fg); }
.btn.danger:hover { background: var(--err-bg); border-color: var(--foreign-bd); }
.btn.danger.solid { background: var(--danger-solid); border-color: var(--danger-solid); color: var(--primary-fg); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.icon { width: 32px; padding: 0; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn .spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Profiles */
.toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar p { color: var(--text-2); }
.legend { flex-basis: 100%; display: grid; grid-template-columns: repeat(2, max-content); gap: 8px 40px; margin: 0; font-size: 12.5px; }
@media (max-width: 760px) { .legend { grid-template-columns: minmax(0, 1fr); } }
.legend > div { display: flex; align-items: center; gap: 8px; }
.legend dt { display: flex; align-items: center; gap: 8px; font-weight: 550; color: var(--text); }
.legend dd { margin: 0; color: var(--text-3); }
.badge.key { width: 22px; height: 20px; padding: 0; justify-content: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr)); gap: 16px; }
.card {
  transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), transform 180ms var(--ease);
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-sm);
}
.card:hover { border-color: var(--border-strong); box-shadow: 0 4px 14px rgba(9, 9, 11, 0.06); transform: translateY(-1px); }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.card-head h2 { font-size: 15px; font-weight: 650; }
.meta { color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
.pill {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap;
  background: var(--surface-2); color: var(--text-2);
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.on { background: var(--ok-bg); color: var(--ok); }
.pill.ep { background: var(--shared-bg); color: var(--shared-fg); }
.groups { display: grid; gap: 8px; }
.group { display: grid; grid-template-columns: 64px 1fr; align-items: start; gap: 8px; }
.group > span { font-size: 12px; color: var(--text-3); line-height: 24px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid;
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.badge svg.i { width: 12px; height: 12px; stroke-width: 2; }
.badge.shared { background: var(--shared-bg); color: var(--shared-fg); border-color: var(--shared-bd); }
.badge.private, .badge.empty { background: var(--private-bg); color: var(--private-fg); border-color: var(--private-bd); }
.badge.missing { background: var(--missing-bg); color: var(--missing-fg); border-color: var(--missing-bd); border-style: dashed; }
.badge.foreign-link { background: var(--foreign-bg); color: var(--foreign-fg); border-color: var(--foreign-bd); }
.badge.changed { animation: changed 1.6s var(--ease); }
.badge.pool { background: var(--shared-bg); color: var(--shared-fg); border-color: var(--shared-bd); }
.pill.me { background: var(--surface-2); color: var(--text-2); }
.pill.me::before { display: none; }
.callout { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.callout p { flex: 1 1 320px; color: var(--text-2); }
.callout p b { color: var(--text); font-weight: 600; }
.table-wrap { overflow-x: auto; border-radius: 10px; }
.matrix th, .matrix td { white-space: nowrap; }
.matrix th.t, .matrix td.cell { text-align: center; }
.matrix td { vertical-align: middle; }
.matrix tbody th { padding: 12px 16px; background: none; border-bottom: 1px solid var(--border); font-size: inherit; color: inherit; font-weight: inherit; text-align: left; vertical-align: middle; }
.matrix tbody tr:last-child th { border-bottom: 0; }
.local-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 16px; }
.local-row .where { font-size: 12.5px; color: var(--text-3); }
.local-row .sub { max-width: 70ch; }
a.btn { text-decoration: none; }
.mcp-name b { font-weight: 600; }
.mcp-name .sub { display: block; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 12px; color: var(--text-3); }
.mark { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 550; }
.mark svg.i { width: 14px; height: 14px; }
.mark.has { color: var(--ok); }
.mark.pool { color: var(--shared-fg); }
.mark.differs { color: var(--warn); }
.mark.none { color: var(--text-3); font-weight: 400; }
.row-actions.end { justify-content: flex-end; }
.local-list { display: grid; gap: 10px; margin-top: 24px; }
.local-list h2 { font-size: 13.5px; font-weight: 600; }
.local-list > p { color: var(--text-2); font-size: 13px; }
.targets { display: grid; gap: 8px; }
.targets label { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; cursor: pointer; }
.targets input { margin: 0; accent-color: var(--primary); }
.targets .mark { justify-self: end; }
.backups { margin-top: 28px; display: grid; gap: 10px; }
.backups h2 { font-size: 13.5px; font-weight: 600; }
.backups > p { color: var(--text-2); font-size: 13px; }
.backup-row { display: flex; align-items: center; gap: 12px; }
.backup-row .what { flex: 1; min-width: 0; }
.backup-row .what code { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-3); }
@keyframes changed {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 0%, transparent); }
  20% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 35%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 0%, transparent); }
}
.card-actions { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
.btn.quiet:hover { color: var(--err-fg); border-color: var(--foreign-bd); background: var(--err-bg); }

.empty {
  display: grid; justify-items: start; gap: 12px; padding: 40px;
  border: 1px dashed var(--border-strong); border-radius: 10px; background: var(--surface);
}
.empty h2 { font-size: 15px; }
.empty p { color: var(--text-2); max-width: 60ch; }

/* Tables (pool, doctor) */
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.table th { text-align: left; font-size: 12px; font-weight: 550; color: var(--text-3); padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; }
.muted { color: var(--text-3); }

.summary { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 550; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.status.error { color: var(--err); }
.check-group { margin-bottom: 4px; }
.check-group[open] { margin-bottom: 16px; }
.check-group summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 6px 0; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
.check-group summary::-webkit-details-marker { display: none; }
.check-group summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(-45deg); transition: transform 160ms var(--ease); }
.check-group[open] summary::before { transform: rotate(45deg); }
.check-group h2 { font-size: 13px; font-weight: 600; color: var(--text-2); }
.check-group summary .status { font-weight: 500; font-size: 12.5px; }
.check { display: grid; grid-template-columns: 20px minmax(160px, 260px) 1fr auto; gap: 10px; align-items: start; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; }
.row-actions:empty { display: none; }
.confirm-note { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid var(--private-bd); border-radius: 8px; background: var(--private-bg); color: var(--private-fg); font-size: 13px; margin-bottom: 4px; }
.check .hint { display: block; margin-top: 4px; color: var(--text-3); font-size: 12.5px; }

/* Activity */
.entries { display: grid; gap: 12px; }
.entry { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.entry summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; }
.entry summary::-webkit-details-marker { display: none; }
.entry summary .when { margin-left: auto; color: var(--text-3); font-size: 12.5px; }
.entry[open] summary { border-bottom: 1px solid var(--border); }
.entry .lines { padding: 8px 16px 12px; }
.entry > .muted { padding: 8px 16px 12px; }

/* Change lines (preview + result) */
.lines { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.lines li {
  display: grid; grid-template-columns: 18px 110px 1fr; gap: 8px; align-items: start;
  padding: 5px 0; font-size: 13px;
}
.lines li .res { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
.lines li.same { color: var(--text-3); }
.lines li.same .res { color: var(--text-3); }
.lines li .k { padding-top: 2px; }
.lines li.change .k { color: var(--primary); }
.lines li.warn .k { color: var(--warn); }
.lines li.error .k, .lines li.error { color: var(--err); }
.lines li.info .k { color: var(--text-3); }
.lines.result li.change .k { color: var(--ok); }
.lines.reveal li { animation: rise 420ms var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Panel */
.scrim { position: fixed; inset: 0; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity 200ms; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21;
  width: min(480px, 100vw); display: flex; flex-direction: column;
  background: var(--surface); box-shadow: var(--shadow-panel);
  transform: translateX(104%); transition: transform 320ms var(--ease);
  visibility: hidden;
}
.panel.open { transform: none; visibility: visible; }
.panel-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: 17px; font-weight: 650; }
.panel-head .meta { margin-top: 2px; }
.panel-head .btn { margin-left: auto; }
.panel-body { flex: 1; overflow-y: auto; padding: 8px 24px 24px; }
.section { padding: 18px 0; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: 0; }
.section h3 { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
.section > p { color: var(--text-2); font-size: 13px; margin-bottom: 12px; }
.share-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; }
.share-row + .share-row { border-top: 1px dashed var(--border); }
.share-row .name { font-weight: 550; }
.share-row .help, .section .actions { margin-top: 2px; }
.help { font-size: 12.5px; color: var(--text-3); }
.section .actions { margin-top: 12px; }
.danger-box .muted { font-size: 13px; }
.spacer { margin-left: auto; }
.share-row .badges { margin-top: 6px; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface-2); }
.seg button {
  border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 12.5px; font-weight: 550;
  padding: 4px 10px; border-radius: 5px; cursor: pointer;
}
.seg button { transition: background 160ms var(--ease), color 160ms var(--ease), box-shadow 160ms var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--shared-fg); box-shadow: var(--shadow-sm); }
.seg button.target[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); }
.now { display: block; margin-top: 4px; text-align: right; font-size: 12px; color: var(--text-3); }
/* Reserved so the toggle never moves. */
.now.idle { visibility: hidden; }
.seg button:disabled { cursor: default; }

.plan {
  margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2);
}
.plan.appear { animation: rise 260ms var(--ease) both; }
.plan.stale .lines, .plan.stale .plan-why { opacity: 0.5; transition: opacity 120ms var(--ease); }
.panel.entering .panel-body > .section { animation: rise 320ms var(--ease) both; }
.panel.entering .panel-body > .section:nth-child(2) { animation-delay: 50ms; }
.panel.entering .panel-body > .section:nth-child(3) { animation-delay: 100ms; }
#view.enter > * { animation: rise 300ms var(--ease) both; }
#view.enter > *:nth-child(2) { animation-delay: 40ms; }
#view.enter > *:nth-child(3) { animation-delay: 80ms; }
#view.enter .card { animation: rise 340ms var(--ease) both; animation-delay: calc(60ms + var(--i, 0) * 35ms); }
:root { interpolate-size: allow-keywords; }
details.check-group::details-content, details.entry::details-content {
  height: 0; overflow: clip; transition: height 260ms var(--ease), content-visibility 260ms allow-discrete;
}
details.check-group[open]::details-content, details.entry[open]::details-content { height: auto; }
.status, .count { transition: color 200ms; }
.plan-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600; }
.plan-head .tag { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-3); }
.plan.done .plan-head { color: var(--ok); }
.plan.failed .plan-head { color: var(--err); }
.plan .lines { padding: 8px 12px; }
.plan-why { margin: 0; padding: 0 12px 10px; font-size: 12.5px; color: var(--text-2); }
.plan-foot {
  position: sticky; bottom: -24px; display: flex; gap: 8px; align-items: center;
  padding: 10px 12px; border-top: 1px solid var(--border); border-radius: 0 0 8px 8px; background: var(--surface);
}
.plan-hint { margin-top: 14px; padding: 12px; border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--text-2); font-size: 13px; }
.plan-foot .note { font-size: 12.5px; color: var(--text-3); margin-right: auto; }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .label { font-size: 13px; font-weight: 550; }
.field .help { font-size: 12.5px; color: var(--text-3); }
.input {
  height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font: inherit;
}
.input::placeholder { color: var(--text-3); }
.input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.input[aria-invalid="true"] { border-color: var(--err); }
.err { color: var(--err-fg); font-size: 12.5px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice label {
  display: grid; gap: 2px; font-weight: 400; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 8px; cursor: pointer;
}
.choice label:has(input:checked) { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.choice input { position: absolute; opacity: 0; }
.choice label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.choice b { font-weight: 600; font-size: 13px; }
.choice span { font-size: 12.5px; color: var(--text-2); }
.checks { display: grid; gap: 10px; }
.checks label { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; cursor: pointer; }
.checks input { margin: 3px 0 0; accent-color: var(--primary); }
.checks b { font-weight: 550; }
.checks span { display: block; font-size: 12.5px; color: var(--text-2); }

.danger-box { border: 1px solid var(--foreign-bd); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.danger-box h3 { color: var(--err-fg); }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 30; transform: translate(-50%, 16px); opacity: 0;
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px;
  background: var(--text); color: var(--bg); font-size: 13px; box-shadow: var(--shadow-toast);
  transition: opacity 200ms, transform 300ms var(--ease); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast a { color: inherit; font-weight: 600; }

.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--err-bg); color: var(--err-fg); margin-bottom: 16px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: static; height: auto; overflow: visible; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: 8px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--border);
  }
  .brand { margin: 0; padding: 0; height: auto; }
  .nav { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 2px; min-width: 0; }
  .nav a { gap: 5px; padding: 0 6px; font-size: 13px; }
  .nav a .count { display: none; }
  .side-foot { grid-column: 2; grid-row: 1; margin: 0; padding: 0; border-top: none; display: flex; align-items: center; gap: 2px; }
  .side-foot .fold, .collapse-row { display: none; }
  .side-foot .row.account { width: auto; min-height: 36px; padding: 0 6px; }
  .side-foot .row.update-row { width: auto; min-height: 36px; padding: 0 9px; }
  .top, .content { padding-left: 16px; padding-right: 16px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .check { grid-template-columns: 20px minmax(0, 1fr); }
  .check > span:nth-child(3) { grid-column: 2; color: var(--text-2); }
  .check > .row-actions { grid-column: 2; justify-content: flex-start; }
  code { overflow-wrap: anywhere; }
  .table.stack thead { display: none; }
  .table.stack tr { display: grid; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .table.stack tr:last-child { border-bottom: 0; }
  .table.stack td { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; padding: 0; border: 0; }
  .table.stack td::before { content: attr(data-label); font-size: 12px; color: var(--text-3); }
}
@media (max-width: 520px) {
  #sync-text { display: none; }
}
@media (max-width: 380px) {
  .nav a svg.i { display: none; }
}
@media (pointer: coarse) {
  .btn { height: 44px; padding: 0 14px; }
  .btn.icon { width: 44px; }
  .seg button { padding: 10px 14px; }
  .menu .theme button { height: 40px; }
  .menu-item { height: 44px; }
  .row { min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  /* No movement; state changes still show, as instant swaps and a static ring. */
  .panel, .toast { transition: none; }
  .lines.reveal li { animation: none; }
  .btn .spin { animation-duration: 2.4s; }
  .badge.changed { animation: none; outline: 2px solid var(--primary); outline-offset: 1px; }
  .check-group summary::before { transition: none; }
  .app, .card, .fold, .seg button, .btn, .tip { transition: none; }
  .menu { animation: none; }
  .card:hover { transform: none; }
  .plan.appear, .panel.entering .panel-body > .section, #view.enter > *, #view.enter .card { animation: none; }
  details.check-group::details-content, details.entry::details-content { transition: none; }
}
