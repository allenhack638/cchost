name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required by npm publish --provenance

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  publish:
    name: publish to npm
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the vX.Y.Z tag and GitHub Release
      id-token: write   # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache here: a poisoned cache must not reach a publish.

      - name: Install
        run: npm ci

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Pin the major: npm@latest
      # moved to 12, which refuses to install on older Node and broke a release.
      # Upgrading the global npm only affects this job's runner.
      - name: Upgrade npm to a Trusted-Publishing-capable version
        run: npm install -g npm@^11.5.1

      # Skip publish (without failing) when package.json's version is already on npm.
      # Lets you push docs/CI tweaks to master without bumping the version every time.
      - name: Check if version is already published
        id: check
        shell: bash
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG_NAME@$PKG_VERSION is already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Authentication is via OIDC Trusted Publishing — no NPM_TOKEN secret
      # needed. Configure the trusted publisher at:
      #   https://www.npmjs.com/package/cchost/access
      # The job's id-token: write permission is what lets npm verify GitHub's
      # OIDC assertion.
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public

      # Tag the published commit and create the GitHub Release from the
      # matching CHANGELOG.md section. Skipped if the release already exists
      # (e.g. created by hand), so re-runs are safe.
      - name: GitHub Release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; skipping."
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION; using a placeholder."
            echo "See CHANGELOG.md." > release-notes.md
          fi
          printf '\n**Install / upgrade:** `npm install -g %s@%s`\n' \
            "${{ steps.check.outputs.package }}" "$VERSION" >> release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-notes.md --latest

      - name: Summary
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Published ${{ steps.check.outputs.package }}@${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
